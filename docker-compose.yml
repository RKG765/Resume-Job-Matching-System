version: "3.8"

services:
  # ============ PostgreSQL with pgvector ============
  postgres:
    image: pgvector/pgvector:pg16
    container_name: resume_matcher_db
    environment:
      POSTGRES_DB: resume_matcher
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 5s
      timeout: 5s
      retries: 5

  # ============ Backend (FastAPI) ============
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: resume_matcher_api
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/resume_matcher
      - USE_SQLITE=false
      - LLM_API_URL=http://host.docker.internal:1234/v1
      - LLM_ENABLED=true
      - DEBUG=true
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - embedding_cache:/root/.cache/huggingface # Cache BERT model

  # ============ Frontend (React/Vite) ============
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: resume_matcher_frontend
    ports:
      - "3000:3000"
    environment:
      - VITE_API_URL=http://localhost:8000
    depends_on:
      - backend

volumes:
  postgres_data:
  embedding_cache:
